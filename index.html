function addVec(vec1, vec2) {
  	var retVec = [];
	  retVec[0] = vec1[0] + vec2[0];
    retVec[1] = vec1[1] + vec2[1];
  	return retVec;
}

function subVec(vec1, vec2) {
  	var retVec = [];
	  retVec[0] = vec1[0] - vec2[0];
    retVec[1] = vec1[1] - vec2[1];
  	return retVec;
}

function mulVector(vec1, vec2) {
  return [vec1[0] * vec2[0], vec1[1] * vec2[1]]
}

function calcAcc(ball_, int, apply = true) {
  for (var j = int+1; j < balls.length; j++) {
    const baller = balls[j];
    // if (baller.check()) continue;
    let diff = apply ? subVec(baller.pos, ball_.pos) : subVec(baller.futurePos, ball_.futurePos);

    let dist = diff[0]**2 + diff[1]**2

    if (dist <= ball_.rad*ball_.rad + baller.rad*baller.rad) {

      // dist = Math.sqrt( (diff[0]**2 + diff[1]**2)  );

      // if (ball_.rad < baller.rad) {
      //   balls.splice(int, 1);
      // } else {
      //   balls.splice(j, 1);
      // }

      // instead of deleting ^
      // set ball to static, and rad to 0, so that the trail disappears slowly
      // check whicher is smaller
      if (ball_.rad < baller.rad) {
        ball_.static = true;
        ball_.mass = 0;
        ball_.vel = [0,0]
        ball_.rad = 0;
        ball_.text = "";
      } else {
        baller.static = true;
        baller.mass = 0;
        baller.vel = [0,0]
        baller.rad = 0;
        baller.rad = 0;
      }


      // dist, diff = ball.applyCollisions(ball_, baller, dist);
      // diff = subVec(baller.pos, ball_.pos);
    } else {
      dist = Math.sqrt( dist );
    }
    
    // get normalized vector
    // hypotanous / hyp = 1
    // side / hyp = normalized
    
    const inv_distance = 1/Math.max(dist,0);
    
    const normalized_x = diff[0] * inv_distance;
    const normalized_y = diff[1] * inv_distance;
    
    // apply inverse square law to gravity
    
    const inverse_square_dropoff = inv_distance * inv_distance
    
    // F = g * ( m_1 * m_2 ) / r^2
    // const g = 6.637*(10**-11)
    let x_1acc = 0;
    let y_1acc = 0;
    let new_1vel = [];

    let x_2acc = 0;
    let y_2acc = 0;
    let new_2vel = [];
    
    if (!ball_.static) {
      // Instead of setting acc, and vel, return the values so..
      // That they could be could be added outside the calculation func.

      x_1acc = normalized_x * g * (baller.mass * inverse_square_dropoff);
      y_1acc = normalized_y * g * (baller.mass * inverse_square_dropoff);

      if (apply) {
        ball_.acc[0] = x_1acc;
        ball_.acc[1] = y_1acc;
      } else {
        ball_.futureAcc = [x_1acc, y_1acc];
      }

      // ball_.acc[0] *= dt
      // ball_.acc[1] *= dt

      new_1vel = addVec(ball_.acc, ball_.vel);

      if (apply) {
        ball_.vel = new_1vel;
      } else {
        ball_.futureVel = new_1vel;
      }
    }

    if (!baller.static) {
      // Instead of setting acc, and vel, return the values so..
      // That they could be could be added outside the calculation func.
      x_2acc = -normalized_x * g * (ball_.mass * inverse_square_dropoff);
      y_2acc = -normalized_y * g * (ball_.mass * inverse_square_dropoff);

      if (apply) {
        baller.acc[0] = x_2acc;
        baller.acc[1] = y_2acc;
      } else {
        baller.futureAcc = [x_2acc, y_2acc];
      }

      // baller.acc[0] *= dt
      // baller.acc[1] *= dt

      new_2vel = addVec(baller.acc, baller.vel);

      if (apply) {
        baller.vel = new_2vel;
      } else {
        baller.futureVel = new_2vel;
      }
      
    }
  }
  // If last body, return undefined for all values, since it crashes otherwise
  // return [undefined,undefined,undefined,undefined]
}

class ball {

    this.velocity_v = false;

    this.grav = grav_;
    
    this.mass = mass;
    this.static = stat;

    this.pos = [x, y];
    this.vel = vel;
    this.acc = [0, 0];

    this.futurePos = [x, y];
    this.futureVel = vel;
    this.futureAcc = [0, 0];

    this.history_toggle = true;
    this.history_length = 5000
  }
  
  check(x,y) {
    // check if outside bounds
    // console.log(originX, originY)
    const minX = (x - c.getBoundingClientRect().left - originX) * scale
    const minY = (y - c.getBoundingClientRect().top - originY) * scale

    if (this.clr == "yellow") console.log((x*2)/scale,minX)
    if ((x) < (minX-this.rad/2)) return true;
    if ((x) > (minX+windowWidth+this.rad/2)) return true;
    if ((y) < (minY-this.rad)) return true;
    if ((y) > (minY+windowHeight+this.rad)) return true;
    return false
  }

  static applyCollisions(obj_1, obj_2, dist2) {
    if (obj_1 == obj_2) return;
    // const dist1 = 
    //   Math.pow(obj_1.pos[0] - obj_2.pos[0],2)
    //   +
    //   Math.pow(obj_1.pos[1] - obj_2.pos[1],2);

    // if (dist1 < (obj_1.rad+obj_2.rad)*(obj_1.rad+obj_2.rad) ) {
    // var dist2 = Math.sqrt(dist1);
    const collisionVec = subVec(obj_1.pos, obj_2.pos);
    const n = [collisionVec[0]/dist2, collisionVec[1]/dist2]
    const delta = obj_1.rad+obj_2.rad-dist2;
    // const coeff = 0.5;
    const n_delta = [0.5*coeff*delta, 0.5*coeff*delta]

    if (!obj_1.static) {
      const old_pos = obj_1.pos;
      obj_1.pos = addVec( obj_1.pos, mulVector(n_delta,n) );
      // obj_1.vel = subVec(obj_1.pos,old_pos);
    }
    if (!obj_2.static) {
      const old_pos = obj_2.pos;
      obj_2.pos = subVec( obj_2.pos, mulVector(n_delta,n) );
      // obj_2.vel = subVec(obj_2.pos,old_pos);
    }
    const change_pos = subVec(obj_2.pos, obj_1.pos)
    const dist = Math.sqrt( (change_pos[0]**2 + change_pos[1]**2)  );
    return dist, change_pos
    // }

  }

    calcAcc(this, i, apply);

    if (!apply) {
      // If not apply, then predict
      this.futurePos = addVec(this.futureVel, this.futurePos)
    }

    // this.vel = addVec(this.acc, this.vel)

    // this.pos[0] = parseFloat(this.pos[0].toPrecision(15))

    if (frame_count % 10 == 0) {

    if (this.history.length > this.history_length) {

    /*

    // }

    //     this.vel[0]=-this.vel[0];

    // }
    */
    // this.x = this.pos[0];
    // this.y = this.pos[1];
    // this.lastCol = this.curCol;
  }
  	
  draw() {

    if (this.history_toggle) {
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255,255,255,0.25)"
      if (this.history.length > 0) {

          if (isLocked == true && balls[lockedBallIndex].history.length > i) {

    // original
    // if (this.check(this.pos[0],this.pos[1])) return
    ctx.beginPath();

    // I wonder what effect i could get if i color 10-50 random points AROUND the point but not the point

    // const o = 30

    // for (let i = 0; i < noise_count; i++) {

    //   const circle_distance = (Math.random()**1)*o
    //   const offset = [
    //     angle[0]*(circle_distance),

    //   ]

    //   // 280 -> 360+30=390
    //   ctx.fillStyle = `hsl(${ Math.min(390,260+this.clr_hsl) },100%,50%)`;

    //   ctx.arc(this.pos[0]+offset[0], this.pos[1]+offset[1], 0.475, 0, 2 * Math.PI);

let balls = [];

const radius = 200
const PI = Math.PI;
const TWO_PI = Math.PI*2;

const ball_1 = [windowWidth/2,windowHeight/2]

function new_ball(...args) {
  balls.push(new ball(...args))
}

function make_galaxy(radius, size, position, min=50, core_gravity = 100, core_vel=[0,0], static_=false, ball_r=2, center_r=6, center_clr="white", ball_clr="white", ball_mass=small_body_mass) {
  const ball_1 = position;
  for (var i = 0; i < size; i++) {
    // from 0-2pi around circle, get normal vector, multiply by random distance.
    const radian_angle = Math.random()*TWO_PI;
    const angle = [
      Math.cos(radian_angle),
      Math.sin(radian_angle)
    ]
    // Get the random distancez
    const circle_distance = Math.random()*radius+min
    // Get vector offset
    const offset = [
      angle[0]*(circle_distance),
      angle[1]*(circle_distance),
    ]

    // gravity = 100
    // const v = Math.sqrt( central_gravity/100 * circle_distance ) / radius

    // v = sqrt( (G * M * m) / r )

    // v = sqrt ( G * Mass / Rad )
    // const grav = Math.sqrt(g*core_gravity/(circle_distance+min))
    const grav = Math.sqrt( (g*core_gravity)/(radius+min) )

    balls.push(new ball(
      offset[0]+ball_1[0],
      offset[1]+ball_1[1],
      false,
      ball_mass,
      // (Math.random()*(10**9))+10**7,
      [
        ((Math.sin(radian_angle)))*grav+core_vel[0],
        (-(Math.cos(radian_angle)))*grav+core_vel[1],
      ],
      ball_r, //rad
      // 1.1, //rad
      ball_clr,
      grav
    ));
  }
  //                   x,           y ,   stat,   mass,          vel,    rad, clr
  balls.push(new ball(ball_1[0],ball_1[1], static_, core_gravity, core_vel, center_r, center_clr));
}

function make_ball(radius, size, position, min=0, ball_gravity = 100, ball_vel=[0,0], static_=false, random_vel=false, skew=0) {
  const ball_1 = position;
  for (var i = 0; i < size; i++) {
    const radian_angle = Math.random()*TWO_PI;
    const angle = [
      Math.cos(radian_angle),
      Math.sin(radian_angle)
    ]
    let circle_distance = Math.random()
    if (skew>0) {
      circle_distance = Math.pow(circle_distance, skew) *radius
      ball_gravity += (radius-circle_distance-min)**2
    } else {
      circle_distance *= radius
    }
    const offset = [
      angle[0]*(circle_distance+min),
      angle[1]*(circle_distance+min),
    ]
    // const grav = Math.sqrt(core_gravity/(circle_distance+min))/distance_factor**2
    if (random_vel) {
      ball_vel = [
        (Math.sin(radian_angle))/(radius/circle_distance),
        -(Math.cos(radian_angle))/(radius/circle_distance),
      ]
    }

    balls.push(new ball(
      offset[0]+ball_1[0],
      offset[1]+ball_1[1],
      static_,
      ball_gravity,
      [
        ball_vel[0],
        ball_vel[1],
      ],
      1.1,
      `rgba(255,255,255, 0.5)`
    ));
  }
  //                   x,           y ,   stat,   mass,          vel,    rad, clr
  // balls.push(new ball(ball_1[0],ball_1[1], static, core_gravity, core_vel, 3, "white"));
}

imgui.width = 300;
function animate() {
  // ctx.fillStyle = 'rgba(0,0,0,0.1)'
	// ctx.fillRect(0, 0, windowWidth, windowHeight);
  ctx.save();
	ctx.clearRect(0, 0, windowWidth, windowHeight);

  if (isLocked && lockedBallIndex !== -1 && balls[lockedBallIndex]) {
    // Ensure the locked ball is centered
    const ball = balls[lockedBallIndex];
    const centerX = c.width / 2;
    const centerY = c.height / 2;

    // Adjust origin to keep the ball centered
    originX = parseInt(centerX - (ball.pos[0] * scale));
    originY = parseInt(centerY - (ball.pos[1] * scale));
  } else if (!balls[lockedBallIndex]) {
    isLocked = false;
    lockedBallIndex = -1;
  }

  ctx.translate(originX, originY);
  ctx.scale(scale, scale);

  // console.log(earth_v_checkbox.state)
  // console.log(earth_a_checkbox.state)

  if (predict.state) {
    // Pause the simulation to allow orbit prediction
    pause = true;

    // Initiate the loop for orbit prediction using the steps in slider
    for (var i = 0; i < predict_slide.state; i++) {
      const ball = balls[i];
      ball.history_toggle = history.state
      ball.update(i, false);
    }
  }

  if (earth_spawn.state) {

    spawn((Math.random()*1_000_0.00)+50_3.57, 1, "gray", balls[0], 1)
    
    earth_spawn.state = false;
  }

  if (earth_spawn_nonCirc.state) {

    spawn((Math.random()*1_000_0.00)+50_3.57, 1, "gray", balls[0], 1)
    balls[balls.length-1].vel = mulVector(balls[balls.length-1].vel, [0.75,0.75])

    earth_spawn_nonCirc.state = false;
  }
  
  if (moon_spawn.state) {

    // moon orbit rad: 384,400 km : 250
    // moon radius 1,737.5 km : 5
    // moon mass: 7.348e+22 kg : 0
    spawn(384_4.00, 1_7.35, "gray", balls[0], 7.348*(10**16))

    moon_spawn.state = false;
  }

  for (var i = 0; i < balls.length; i++) {
    const ball = balls[i];
    ball.history_toggle = history.state
    if (!pause) ball.update(i, true);
    ball.draw();
    if (i == 1) continue
    ball.velocity_v = earth_v_checkbox.state
    // ball.acc_v = earth_a_checkbox.state
  }
  
  ctx.restore();
  
  if (earth_a_checkbox.state) {
    for (var i = 0; i < balls.length; i++) {
      const ball = balls[i];
      // if (scale <= 0.1) {
        ImGui.text(
          `Planet #${i+1}`,
          ((ball.pos[0]+ball.rad)*scale+originX),
          ((ball.pos[1]+ball.rad/2)*scale+originY),
          "18px sans-serif"
        )
      // }
    }
  }

  imgui.draw();
  
  frame_count++
  if (frame_count >= 60) frame_count = 0

  window.requestAnimationFrame(animate);
}

let mouse = false;
let mx = 0;
let my = 0;
let isLocked = true;
let lockedBallIndex = 0;

c.addEventListener('mousedown', (e) => {
  if (!imgui.checkBounding(e.x, e.y) && e.button == 0) {
    mouse = true;
    mx = e.x;
    my = e.y;
    // c.style.cursor = 'grabbing'; // Change cursor to indicate panning
  } else if (e.button == 2) {
    // lock on to the ball at this location
    const mouseX = (e.clientX - c.getBoundingClientRect().left - originX) / scale;
    const mouseY = (e.clientY - c.getBoundingClientRect().top - originY) / scale;

    for (let i = 0; i < balls.length; i++) {
      const ball = balls[i];
      const distance = Math.sqrt(
        (mouseX - ball.pos[0]) ** 2 + (mouseY - ball.pos[1]) ** 2
      );

      if (distance <= ball.rad) {
        isLocked = true;
        lockedBallIndex = i; // Lock onto this ball
        break;
      } else {
        isLocked = false;
        lockedBallIndex = -1;
      }
    }
  }
})

c.addEventListener("mousemove", (e) => {
  if (mouse) {
    c.style.cursor = 'grabbing'; // Change cursor to indicate panning
    const deltaX = e.x - mx;
    const deltaY = e.y - my;
    
    // Update the origin based on mouse movement
    originX += deltaX;
    originY += deltaY;

    // Update the last mouse position
    mx = e.x;
    my = e.y;

    isLocked = false;
    lockedBallIndex = -1;
  }
});

c.addEventListener("mouseup", () => {
  mouse = false;
  c.style.cursor = 'default'; // Revert cursor back
});

// Handle mouse leave to stop panning when the cursor leaves canvas
c.addEventListener("mouseleave", () => {
  mouse = false;
  c.style.cursor = 'default';
});

document.addEventListener("wheel", (e) => {
  // on scroll, change the scroll variable
  e.preventDefault();
  const zoomFactor = 1.1; // Zoom speed
  const delta = Math.sign(e.deltaY); // Detect scroll direction (up or down)

  // Mouse position relative to canvas
  const rect = c.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  // Adjust scale
  const newScale = Math.min(
    Math.max(
      delta < 0 ? scale * zoomFactor : scale / zoomFactor, 0.0001), 1000000);

  

  // Adjust origin to zoom towards mouse position
  originX = mouseX - (mouseX - originX) * (newScale / scale);
  originY = mouseY - (mouseY - originY) * (newScale / scale);

  scale = newScale;
})

document.addEventListener("keydown", (e) => {
  // 32 == SPACE
  if (e.keyCode == 32 && !pause) {
    pause = true;
    console.log(balls)
  } else if (e.keyCode == 32 && pause) {
    pause = false;
  }

  if (parseInt(e.key)) {
    isLocked = true;
    lockedBallIndex = parseInt(e.key)-1; // Lock onto this ball
  }

  // left arrow 37, slowdown sim; right 39, speedup sim;

  // if (e.keyCode == 39) {
  //   dt *= 10;
  // }
})
