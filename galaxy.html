function numberWithCommas(x) {
    return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function addVec(vec1, vec2) {
  	var retVec = [];
	  retVec[0] = vec1[0] + vec2[0];
    retVec[1] = vec1[1] + vec2[1];
  	return retVec;
}

function subVec(vec1, vec2) {
  	var retVec = [];
	  retVec[0] = vec1[0] - vec2[0];
    retVec[1] = vec1[1] - vec2[1];
  	return retVec;
}

function mulVector(vec1, vec2) {
  return [vec1[0] * vec2[0], vec1[1] * vec2[1]]
}

function rect(x, y, w, h, c='white') {
  const of = ctx.fillStyle;
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.fill();
  ctx.fillStyle = of;
}

function round_rect(x, y, w, h, c, r) {
  ctx.beginPath();
  ctx.fillStyle = c;
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

class Quadtree {
  constructor(topLeft, bottomRight) {
    //   { x, y }
    this.topLeft = topLeft;
    //   { x, y }
    this.botRight = bottomRight;

    this.n = null;

    // Another Quadtree (recursive)
    this.topLeftTree = null;
    this.topRightTree = null;
    this.botLeftTree = null;
    this.botRightTree = null;
  }

  insert(ball) {
    // if no point
    if (ball === null) {
      return;
    }

    // If point not in boundary of quad
    if (!this.inBoundary(ball.pos)) {
      return;
    }

    // We are at a quad of unit area
    // We cannot subdivide this quad further
    if (Math.abs(this.topLeft.x - this.botRight.x) <= 1 || Math.abs(this.topLeft.y - this.botRight.y) <= 1) {
      if (this.n === null) {
        this.n = node;
      }
      return;
    }

    // decide where the point belongs in the 4 new quad trees
    if ((this.topLeft.x + this.botRight.x) / 2 >= node.pos.x) {
      // Indicates topLeftTree
      if ((this.topLeft.y + this.botRight.y) / 2 >= node.pos.y) {
        if (this.topLeftTree === null) {
          this.topLeftTree = new Quadtree(
            this.topLeft, 
            new Point((this.topLeft.x + this.botRight.x) / 2, (this.topLeft.y + this.botRight.y) / 2)
          );
        }
        this.topLeftTree.insert(node);
      }
      // Indicates botLeftTree
      else {
        if (this.botLeftTree === null) {
          this.botLeftTree = new Quadtree(
            new Point(this.topLeft.x, (this.topLeft.y + this.botRight.y) / 2), 
            new Point((this.topLeft.x + this.botRight.x) / 2, this.botRight.y)
          );
        }
        this.botLeftTree.insert(node);
      }
    } else {
      // Indicates topRightTree
      if ((this.topLeft.y + this.botRight.y) / 2 >= node.pos.y) {
        if (this.topRightTree === null) {
          this.topRightTree = new Quadtree(
            new Point((this.topLeft.x + this.botRight.x) / 2, this.topLeft.y), 
            new Point(this.botRight.x, (this.topLeft.y + this.botRight.y) / 2)
          );
        }
        this.topRightTree.insert(node);
      }
      // Indicates botRightTree
      else {
        if (this.botRightTree === null) {
          this.botRightTree = new Quadtree(
            new Point((this.topLeft.x + this.botRight.x) / 2, (this.topLeft.y + this.botRight.y) / 2), 
            this.botRight
          );
        }
        this.botRightTree.insert(node);
      }
    }

  }

  // Find a node in a quadtree
  search(p) {
    // Current quad cannot contain it
    if (!this.inBoundary(p)) {
      return 0;  // Return 0 if point is not found
    }

    // We are at a quad of unit length
    // We cannot subdivide this quad further
    if (this.n !== null) {
      return this.n;
    }

    if ((this.topLeft.x + this.botRight.x) / 2 >= p.x) {
      // Indicates topLeftTree
      if ((this.topLeft.y + this.botRight.y) / 2 >= p.y) {
        if (this.topLeftTree === null) {
          return 0;
        }
        return this.topLeftTree.search(p);
      }
      // Indicates botLeftTree
      else {
        if (this.botLeftTree === null) {
          return 0;
        }
        return this.botLeftTree.search(p);
      }
    } else {
      // Indicates topRightTree
      if ((this.topLeft.y + this.botRight.y) / 2 >= p.y) {
        if (this.topRightTree === null) {
          return 0;
        }
        return this.topRightTree.search(p);
      }
      // Indicates botRightTree
      else {
        if (this.botRightTree === null) {
          return 0;
        }
        return this.botRightTree.search(p);
      }
    }
  }

  // Check if current quadtree contains the point
  inBoundary(p) {
    return p.x >= this.topLeft.x && p.x <= this.botRight.x && p.y >= this.topLeft.y && p.y <= this.botRight.y;
  }

  

}


const distance_factor = 1;
const g = (6.637*(10**-15)); // 6.637 * 10**-11 ; -23/-21 when changed by 10^6  (10^6)^2  like the r^2
const small_body_mass = 10**13; // earth is 10^24, so reduce by 10^11
const coeff = 1;

let frame_count = 0;
let dt = 1;

function calcAcc(ball_, int, apply = true) {
  for (var j = int+1; j < balls.length; j++) {
    const baller = balls[j];
    // Skip bodies that only gravitate toward a single target (asteroids)
    if (baller.gravIdx >= 0) continue;
    const dx = apply ? baller.pos[0] - ball_.pos[0] : baller.futurePos[0] - ball_.futurePos[0];
    const dy = apply ? baller.pos[1] - ball_.pos[1] : baller.futurePos[1] - ball_.futurePos[1];

    let dist = dx * dx + dy * dy

    if (dist <= ball_.rad*ball_.rad + baller.rad*baller.rad && apply) {

      if (ball_.rad < baller.rad) {
        ball_.static = true;
        ball_.mass = 0;
        ball_.vel = [0,0]
        ball_.rad = 0;
        ball_.text = "";
      } else {
        baller.static = true;
        baller.mass = 0;
        baller.vel = [0,0]
        baller.rad = 0;
        baller.rad = 0;
      }

      dist = Math.sqrt( dist );
    } else {
      dist = Math.sqrt( dist );
    }
    
    const inv_distance = 1/Math.max(dist,0);

    const normalized_x = dx * inv_distance;
    const normalized_y = dy * inv_distance;
    
    const inverse_square_dropoff = inv_distance * inv_distance
    
    let x_1acc = 0;
    let y_1acc = 0;
    let x_2acc = 0;
    let y_2acc = 0;
    
    if (!ball_.static) {
      x_1acc = normalized_x * g * (baller.mass * inverse_square_dropoff);
      y_1acc = normalized_y * g * (baller.mass * inverse_square_dropoff);

      if (apply) {
        if (ball_.acc) { ball_.acc[0] = x_1acc; ball_.acc[1] = y_1acc; }
        ball_.vel[0] += x_1acc * dt;
        ball_.vel[1] += y_1acc * dt;
      } else {
        if (ball_.futureAcc) { ball_.futureAcc[0] = x_1acc; ball_.futureAcc[1] = y_1acc; }
        ball_.futureVel[0] += x_1acc;
        ball_.futureVel[1] += y_1acc;
      }
    }

    if (!baller.static) {
      x_2acc = -normalized_x * g * (ball_.mass * inverse_square_dropoff);
      y_2acc = -normalized_y * g * (ball_.mass * inverse_square_dropoff);

      if (apply) {
        if (baller.acc) { baller.acc[0] = x_2acc; baller.acc[1] = y_2acc; }
        baller.vel[0] += x_2acc * dt;
        baller.vel[1] += y_2acc * dt;
      } else {
        if (baller.futureAcc) { baller.futureAcc[0] = x_2acc; baller.futureAcc[1] = y_2acc; }
        baller.futureVel[0] += x_2acc;
        baller.futureVel[1] += y_2acc;
      }
    }
  }
}

    this.futureHist = [];
    
    this.rad = rad;

    this.text = ""
    this.velocity_v = false;
    this.acc_v = false;
    this.grav = grav_;
    
    this.mass = mass;
    this.static = static_;
    this.gravIdx = -1; // -1 = full n-body, >=0 = only gravitate toward balls[gravIdx]

    this.pos = [x, y];
    this.vel = vel;
    this.acc = [0, 0];

    this.futurePos = [x, y];
    this.futureVel = [vel[0], vel[1]];
    this.futureAcc = [0, 0];

    this.history_toggle = true;
    // this.history_length = 5000

    // visual options
    // this.quality = options.quality || 1.0; // 0.5 to 1.5
    // this.seed = options.seed || Math.floor(Math.random() * 100000);
    // this.ring = {

    //   inner: 1.5, outer: 2.3, 
    //   tilt: (options.ringTilt ?? 0.4), 
    //   color: options.ringColor || 'rgba(200,180,140,0.6)',

    // };
    // this.atmosphere = { 
    //   color: options.atmosColor || 'rgba(70,150,255,0.15)', 
    //   width: options.atmosWidth || 0.12 
    // };
    // this.clouds = {

    // // offscreen canvases for layers
    // this.texCanvas = null;      // base terrain + night lights + baked lighting (static)
    // this.cloudCanvas = null;    // cloud texture (reused and offset per-frame)
    // this.ringCanvas = null;     // ring pre-rendered
    // this._dirtyTexture = true;  // regenerate when radius/seed change
    // this._dirtyRings = true;

    // // store timestamp for animations
    // this._time = 0;

    // // starfield shared
    // BallShared.makeStarfield(1024, 1500);
  }
  
  check(x,y) {
    // check if outside bounds
    // console.log(originX, originY)
    const minX = (x - c.getBoundingClientRect().left - originX) * scale
    const minY = (y - c.getBoundingClientRect().top - originY) * scale

    if (this.clr == "yellow") console.log((x*2)/scale,minX)
    if ((x) < (minX-this.rad/2)) return true;
    if ((x) > (minX+windowWidth+this.rad/2)) return true;
    if ((y) < (minY-this.rad)) return true;
    if ((y) > (minY+windowHeight+this.rad)) return true;
    return false
  }

  static applyCollisions(obj_1, obj_2, dist2) {
    if (obj_1 == obj_2) return;
    // const dist1 = 
    //   Math.pow(obj_1.pos[0] - obj_2.pos[0],2)
    //   +
    //   Math.pow(obj_1.pos[1] - obj_2.pos[1],2);

    // if (dist1 < (obj_1.rad+obj_2.rad)*(obj_1.rad+obj_2.rad) ) {
    // var dist2 = Math.sqrt(dist1);
    const collisionVec = subVec(obj_1.pos, obj_2.pos);
    const n = [collisionVec[0]/dist2, collisionVec[1]/dist2]
    const delta = obj_1.rad+obj_2.rad-dist2;
    // const coeff = 0.5;
    const n_delta = [0.5*coeff*delta, 0.5*coeff*delta]

    if (!obj_1.static) {
      const old_pos = obj_1.pos;
      obj_1.pos = addVec( obj_1.pos, mulVector(n_delta,n) );
      // obj_1.vel = subVec(obj_1.pos,old_pos);
    }
    if (!obj_2.static) {
      const old_pos = obj_2.pos;
      obj_2.pos = subVec( obj_2.pos, mulVector(n_delta,n) );
      // obj_2.vel = subVec(obj_2.pos,old_pos);
    }
    const change_pos = subVec(obj_2.pos, obj_1.pos)
    const dist = Math.sqrt( (change_pos[0]**2 + change_pos[1]**2)  );
    return dist, change_pos
    // }

  }

  update(i, apply = true, frame = 1) {
    // if(this.static) return;
    // this.acc = [0,0];
    this.clr_hsl = 0
    if (this.gravIdx >= 0 && this.gravIdx < balls.length) {
      // Only gravitate toward the single target body (no array allocations)
      const target = balls[this.gravIdx];
      if (!target.static) {
        const dx = apply ? target.pos[0] - this.pos[0] : target.futurePos[0] - this.futurePos[0];
        const dy = apply ? target.pos[1] - this.pos[1] : target.futurePos[1] - this.futurePos[1];
        const dist = Math.sqrt(dx * dx + dy * dy);
        const inv_dist = 1 / Math.max(dist, 0);
        const force = g * target.mass * inv_dist * inv_dist * inv_dist;
        const ax = dx * force;
        const ay = dy * force;
        if (!apply) {
          this.futureVel[0] += ax;
          this.futureVel[1] += ay;
        } else {
          this.vel[0] += ax * dt;
          this.vel[1] += ay * dt;
        }
      }
    } else {
      calcAcc(this, i, apply);
    }

    if (!apply) {
      this.futurePos[0] += this.futureVel[0] * dt;
      this.futurePos[1] += this.futureVel[1] * dt;
      if (frame % Math.floor(Math.max(predict_slide.state/100_000, 10)) == 0) this.futureHist.push([this.futurePos[0], this.futurePos[1]]);
      return
    } else {
      this.pos[0] += this.vel[0] * dt;
      this.pos[1] += this.vel[1] * dt;
    }
    
    this.history.push(this.pos);

    if (this.history.length > history_length) {
      this.history.shift();
    }
  }

  // -----------------------
  // hover detection & HUD
  // -----------------------
  isHovered(mouseX, mouseY) {
    const dx = mouseX - this.pos[0];
    const dy = mouseY - this.pos[1];
    return dx * dx + dy * dy <= this.rad * this.rad;
  }

  // called when geometry/scale changes
  markDirty() {
    this._dirtyTexture = true;
    this._dirtyRings = true;
  }
  
  // ---------- helpers ----------
  _ensureTexCanvases() {
    const size = 128;
    if (!this.texCanvas || this.texCanvas.width !== size) {
      this.texCanvas = document.createElement('canvas');
      this.texCanvas.width = size;
      this.texCanvas.height = size;
      this._dirtyTexture = true;
    }
    if (!this.cloudCanvas || this.cloudCanvas.width !== size) {
      this.cloudCanvas = document.createElement('canvas');
      this.cloudCanvas.width = size;
      this.cloudCanvas.height = size;
      this.cloudCanvasCtx = this.cloudCanvas.getContext('2d');
      this._dirtyCloudPattern = true;
    }
    if (!this.ringCanvas) {
      this.ringCanvas = document.createElement('canvas');
      this.ringCanvas.width = this.ringCanvas.height = size;
      this.ringCanvasCtx = this.ringCanvas.getContext('2d');
      this._dirtyRings = true;
    }
  }

  // Example "sunDir" normalization & lifting: accept either {dir:[x,y,z]} or {dir2:[x,y]} or {pos:[x,y,z]} relative to planet.
  _computeSunDir(sun) {
    let sx = 1, sy = 0, sz = -0.4;
    if (!sun) return [sx, sy, sz];
    if (sun.dir && sun.dir.length === 3) { sx = sun.dir[0]; sy = sun.dir[1]; sz = sun.dir[2]; }
    else if (sun.dir2 && sun.dir2.length === 2) { sx = sun.dir2[0]; sy = sun.dir2[1]; sz = -0.4; }
    else if (sun.pos && sun.pos.length === 3) {
      // direction from surface to sun (world coords)
      sx = sun.pos[0] - this.pos[0];
      sy = sun.pos[1] - this.pos[1];
      sz = sun.pos[2] ?? -200; // if no Z given, assume far in front/back
    } else if (sun.pos && sun.pos.length === 2) {
      sx = sun.pos[0] - this.pos[0];
      sy = sun.pos[1] - this.pos[1];
      sz = -200;
    }
    const len = Math.hypot(sx, sy, sz) || 1;
    return [sx / len, sy / len, sz / len];
  }
  
  // -----------------------
  // Generate base planet texture (baked terrain + lighting + nightlights)
  // This is the most expensive step; done only on dirty or size/seed change.
  // -----------------------
  _generateBaseTexture(sunDir3 = [1, 0, -0.4]) {
    this._ensureTexCanvases();
    const canvas = this.texCanvas;
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    ctx.clearRect(0, 0, size, size);

    // create ImageData and fill per-pixel only inside circle
    const im = ctx.createImageData(size, size);
    const data = im.data;
    const cx = size / 2, cy = size / 2;
    const r = size / 2;

    // small deterministic offset for seed influence
    const seedOffset = (this.seed % 1000) * 0.001;

    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const dx = (px + 0.5 - cx) / r; // -1..1
        const dy = (py + 0.5 - cy) / r;
        const dist2 = dx * dx + dy * dy;
        const idx = (py * size + px) * 4;

        if (dist2 > 1.0) {
          // transparent outside sphere
          data[idx + 0] = 0;
          data[idx + 1] = 0;
          data[idx + 2] = 0;
          data[idx + 3] = 0;
          continue;
        }

        // compute 3D normal on sphere surface
        const nx = dx;
        const ny = dy;
        const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny)); // positive z pointing "out of screen"

        // spherical param coords for noise mapping
        const u = 0.5 + Math.atan2(nz, nx) / (2 * Math.PI); // approx longitude
        const v = 0.5 - Math.asin(ny) / Math.PI;            // approx latitude

        // fbm base
        const freq = 6.0;
        const nval = fbm2((u + seedOffset) * freq * 1.0, (v + seedOffset) * freq * 1.0, 5);

        // make bands (useful for gas giants) and tiny details
        const bandNoise = Math.sin((v + fbm2(u * 20.0, v * 20.0) * 0.03) * 60.0) * 0.5 + 0.5;
        const baseR = lerp(34 / 255, 220 / 255, Math.min(1, Math.pow(nval, 1.1)));
        const baseG = lerp(60 / 255, 150 / 255, nval * 0.9);
        const baseB = lerp(60 / 255, 80 / 255, 1 - nval * 0.7);

        // blend in bands slightly
        const baseColor = [
          lerp(baseR, 240 / 255, bandNoise * 0.08),
          lerp(baseG, 200 / 255, bandNoise * 0.06),
          lerp(baseB, 160 / 255, bandNoise * 0.04),
        ];

        // lighting: Lambert + small Blinn spec
        const LdotN = Math.max(0, nx * sunDir3[0] + ny * sunDir3[1] + nz * sunDir3[2]);
        const ambient = 0.18;
        const diff = ambient + LdotN * 0.82;
        // specular estimate
        const view = [0, 0, 1];
        const hx = (sunDir3[0] + view[0]) * 0.5;
        const hy = (sunDir3[1] + view[1]) * 0.5;
        const hz = (sunDir3[2] + view[2]) * 0.5;
        const hlen = Math.hypot(hx, hy, hz) || 1;
        const hxN = hx / hlen, hyN = hy / hlen, hzN = hz / hlen;
        const spec = Math.pow(Math.max(0, nx * hxN + ny * hyN + nz * hzN), 36) * 0.6;

        // night lights: where LdotN is small show emissive spots using higher-frequency fbm
        const nightMask = smoothstep(0.0, 0.15, 1.0 - LdotN);
        const nightNoise = fbm2((u + seedOffset) * 80.0, (v + seedOffset) * 80.0, 4);
        const night = nightMask * Math.max(0, nightNoise - 0.6) * 3.0;

        const rcol = clamp01((baseColor[0] * diff + spec) + night * 1.2);
        const gcol = clamp01((baseColor[1] * diff + spec) + night * 0.6);
        const bcol = clamp01((baseColor[2] * diff + spec) + night * 0.2);

        data[idx + 0] = Math.round(rcol * 255);
        data[idx + 1] = Math.round(gcol * 255);
        data[idx + 2] = Math.round(bcol * 255);
        data[idx + 3] = 255;
      }
    }
    ctx.putImageData(im, 0, 0);
    this._dirtyTexture = false;
  }

  // -----------------------
  // Cloud layer generation (fast) - we keep a pattern canvas and shift it each frame
  // -----------------------
  _generateCloudPattern() {
    this._ensureTexCanvases();
    const c = this.cloudCanvas;
    const ctx = c.getContext('2d');
    const size = c.width;
    ctx.clearRect(0, 0, size, size);

    // draw fbm to cloud canvas - thresholded for puffy clouds
    const im = ctx.createImageData(size, size);
    const data = im.data;
    const seedOffset = (this.seed % 1000) * 0.001 + 77.7;

    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const u = px / size, v = py / size;
        // higher frequency
        let n = fbm2((u + seedOffset) * 8.0, (v + seedOffset) * 8.0, 5) * 1.1;
        // enhance contrast for cloud shapes
        n = Math.pow(n, 1.6);
        const idx = (py * size + px) * 4;
        const alpha = Math.max(0, Math.min(1, (n - 0.45) * 2.2));
        // white cloud color
        data[idx + 0] = 255;
        data[idx + 1] = 255;
        data[idx + 2] = 255;
        data[idx + 3] = Math.round(alpha * 255);
      }
    }
    ctx.putImageData(im, 0, 0);

    // blur to make clouds soft
    // ctx.globalCompositeOperation = 'source-atop';
    ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'blur(6px)';
    const temp = document.createElement('canvas');
    temp.width = temp.height = size;
    temp.getContext('2d').drawImage(c, 0, 0);
    ctx.clearRect(0, 0, size, size);
    ctx.filter = 'none';
    ctx.drawImage(temp, 0, 0);
    this._dirtyCloudPattern = false;
  }

  // -----------------------
  // Rings pre-render
  // -----------------------
  // Replace your old _generateRings with this improved version
  // Replace your old _generateRings with this improved version
  _generateRings() {
    if (!this.ring.enabled) return;
    this._ensureTexCanvases();
    const c = this.ringCanvas;
    const ctx = c.getContext('2d');
    const w = c.width = 1024; // ensure big enough
    const h = c.height = w;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;

    // pixel inner/outer radii (based on planet radius)
    const inner = Math.max(1, Math.round(200 * this.ring.inner));
    const outer = Math.max(inner + 2, Math.round(200 * this.ring.outer));
    const ringWidth = outer - inner;

    // density: how many particles (tune for performance)
    // fewer particles for thin/far rings, more for large close rings
    const baseDensity = 0.2; // tweak 0.2..2.0
    const particleCount = Math.max(300, Math.round(ringWidth * ringWidth * baseDensity));

    // pre-parse color, fallback if not provided (we'll use ctx.fillStyle directly)
    ctx.fillStyle = this.ring.color || 'rgba(220,200,160,0.6)';

    // draw many tiny particles distributed across angle & radius
    for (let i = 0; i < particleCount; i++) {
      const ang = Math.random() * Math.PI * 2;           // uniform angle
      // radius distribution biased slightly toward center of band for density variety
      const r = inner + Math.pow(Math.random(), 0.9) * ringWidth;

      // elliptical flattening to create tilt illusion (same flatten used in draw())
      const flatten = 1 - (this.ring.tilt || 0.35); // 0 = fully flat, 1 = no flatten
      const px = Math.cos(ang) * r;
      const py = Math.sin(ang) * r * flatten;

      // small tangential particle size (longer along tangent -> continuous arcs)
      const sizeLong = (1.0 + Math.random() * 3.0) * (1.0 + ringWidth / 40); // length along tangent
      const sizeShort = Math.max(1, (0.4 + Math.random() * 1.2));            // thickness across ring

      const drawX = cx + px;
      const drawY = cy + py;

      ctx.save();
      ctx.translate(drawX, drawY);
      ctx.rotate(ang + Math.PI / 2); // make particle align tangentially
      ctx.globalAlpha = (0.35 + Math.random() * 0.6) * 0.9; // randomize alpha
      // draw a small rounded rectangle / ellipse to represent ring dust
      ctx.beginPath();
      ctx.ellipse(0, 0, sizeLong * 0.5, sizeShort * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // apply a smooth radial alpha mask (fade edges)
    // create mask canvas:
    const mask = document.createElement('canvas');
    mask.width = w; mask.height = h;
    const mx = mask.getContext('2d');

    // radial gradient from center: 0 = transparent inside hole, 1 = opaque in middle, 0 = transparent outside
    const grad = mx.createRadialGradient(cx, cy, Math.max(0, inner * 0.85), cx, cy, outer * 1.05);
    // numbers chosen to give soft inner/outer falloff
    grad.addColorStop(0.0, 'rgba(0,0,0,0)');       // inside hole = transparent
    grad.addColorStop( (inner / outer) * 0.92, 'rgba(0,0,0,0.0)'); // still transparent near inner edge
    grad.addColorStop( (inner / outer) * 1.02, 'rgba(0,0,0,1.0)'); // main band area opaque
    grad.addColorStop(1.0, 'rgba(0,0,0,0.0)');     // outer falloff to transparent
    mx.fillStyle = grad;
    mx.fillRect(0, 0, w, h);

    // use mask to punch out / fade the ring: destination-in keeps only where mask has alpha
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(mask, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    // optionally add a soft blur (light box blur) to remove harsh pixels — enable if needed
    // ctx.filter = 'blur(0.8px)';
    // const tmp = document.createElement('canvas');
    // tmp.width = tmp.height = w;
    // tmp.getContext('2d').drawImage(c, 0, 0);
    // ctx.clearRect(0,0,w,h);
    // ctx.filter = 'none';
    // ctx.drawImage(tmp, 0, 0);

    this._dirtyRings = false;
  }

  drawText() {
    if (!this.static && scale < 0.0000001) return;
    
    // 1. Rough world-space cull
    if (Math.abs(this.pos[0] - originX) >= 1e19 || Math.abs(this.pos[1] - originY) >= 1e19) return;

    // 2. Calculate screen position
    const x = (this.pos[0] - originX) * scale + windowWidth / 2;
    const y = (this.pos[1] - originY) * scale + windowHeight / 2;
    const screenR = this.rad * scale;
    const tx = x + screenR;
    const ty = y + screenR / 2;

    // 3. Viewport Culling (CRITICAL: Skip if off-screen)
    if (tx < -100 || tx > windowWidth + 100 || ty < -20 || ty > windowHeight + 20) return;

    // 4. Quantize alpha to prevent unique strings (round to 2 decimal places)
    let alpha = 1;
    const fadeStart = 1e-15; // Scale where text is 100% visible (1.0)
    const fadeEnd   = 1e-26; // Scale where text is 0% visible (0.0)

    if (scale <= fadeStart) {
      // Linear interpolation formula that cleanly maps your range from 1 to 0
      alpha = Math.max(0, Math.min(1, (fadeEnd - scale) / (fadeEnd - fadeStart)));
    }

    if (!this.static) {
      if (scale <= 1e-6) alpha = Math.max(0, (1e-7 - scale) / (1e-8 - 1e-6));
    }
    
    // Fast truncation to 2 decimal places (e.g., 0.85 instead of 0.8539281)
    const fixedAlpha = (alpha * 100 | 0) / 100; 

    // Now stars with similar alphas will share the exact same string, 
    // allowing our ImGui.text() optimization to actually skip state changes!
    const colorString = `rgba(255,255,255,${fixedAlpha})`;

    ImGui.text(this.text, tx, ty, colorString);
  }

let balls = [];

const PI = Math.PI;
const TWO_PI = Math.PI*2;

function make_galaxy(radius, size, position, min=50, core_gravity = 100, core_vel=[0,0], static_=false, ball_r=2, center_r=6, center_clr="white", ball_clr="white", ball_mass=small_body_mass) {
  const ball_1 = position;
  for (var i = 0; i < size; i++) {
    // from 0-2pi around circle, get normal vector, multiply by random distance.
    const radian_angle = Math.random()*TWO_PI;
    const angle = [
      Math.cos(radian_angle),
      Math.sin(radian_angle)
    ]
    // Get the random distancez
    const circle_distance = Math.random()*radius+min
    // Get vector offset
    const offset = [
      angle[0]*(circle_distance),
      angle[1]*(circle_distance),
    ]

    // gravity = 100
    // const v = Math.sqrt( central_gravity/100 * circle_distance ) / radius

    // v = sqrt( (G * M * m) / r )

    // v = sqrt ( G * Mass / Rad )
    // const grav = Math.sqrt(g*core_gravity/(circle_distance+min))
    const grav = Math.sqrt( (g*core_gravity)/(radius+min) )

    balls.push(new ball(
      offset[0]+ball_1[0],
      offset[1]+ball_1[1],
      false,
      ball_mass,
      // (Math.random()*(10**9))+10**7,
      [
        ((Math.sin(radian_angle)))*grav+core_vel[0],
        (-(Math.cos(radian_angle)))*grav+core_vel[1],
      ],
      ball_r, //rad
      // 1.1, //rad
      ball_clr,
      grav
    ));
  }
  //                   x,           y ,   stat,   mass,          vel,    rad, clr
  balls.push(new ball(ball_1[0],ball_1[1], static_, core_gravity, core_vel, center_r, center_clr));
}

function make_ball(radius, size, position, min=0, ball_gravity = 100, ball_vel=[0,0], static_=false, random_vel=false, skew=0) {
  const ball_1 = position;
  for (var i = 0; i < size; i++) {
    const radian_angle = Math.random()*TWO_PI;
    const angle = [
      Math.cos(radian_angle),
      Math.sin(radian_angle)
    ]
    let circle_distance = Math.random()
    if (skew>0) {
      circle_distance = Math.pow(circle_distance, skew) *radius
      ball_gravity += (radius-circle_distance-min)**2
    } else {
      circle_distance *= radius
    }
    const offset = [
      angle[0]*(circle_distance+min),
      angle[1]*(circle_distance+min),
    ]
    // const grav = Math.sqrt(core_gravity/(circle_distance+min))/distance_factor**2

function spawnAsteroid(distKm, radiusKm, mass, name, color) {
  const grav = Math.sqrt((g * sun_ball.mass) / distKm);
  const angle = Math.random() * TWO_PI;
  const b = new ball(
    Math.cos(angle) * distKm + sun_ball.pos[0],
    Math.sin(angle) * distKm + sun_ball.pos[1],
    false,
    mass,
    [Math.sin(angle) * grav, -Math.cos(angle) * grav],
    radiusKm,
    color,
    grav
  );
  b.text = name;
  b.gravIdx = 0; // Only gravitate toward Sun (index 0)
  balls.push(b);
}

function predictFunc() {
  // Pause the simulation to allow orbit prediction

  if (unsafe_toggle.state) {
    pause = true;
    pred_history.state = false;
  }

  // Set the number of steps for orbit prediction based on the slider value
  predicted = predict_slide.state;

  for (var i = 0; i < balls.length; i++) {
    const ball = balls[i];
    // Reset the balls future params for orbital prediction (deep copy to avoid shared references)
    ball.futurePos = [ball.pos[0], ball.pos[1]];
    ball.futureVel = [ball.vel[0], ball.vel[1]];
    ball.futureAcc = ball.acc ? [ball.acc[0], ball.acc[1]] : [0, 0];

    ball.futureHist = [];
  }

  // Initiate the loop for orbit prediction using the steps in slider
  let frame = 0
  for (var s = 0; s < predict_slide.state; s++) {
    for (var i = 0; i < balls.length; i++) {
      const ball = balls[i];
      ball.update(i, false, frame);
    }
    frame++;
  }
}

function recenterWorld(threshold = 1e5) {
  if (Math.abs(originX) < threshold && Math.abs(originY) < threshold) return;
  // shift everything so camera-origin becomes 0,0
  for (let b of balls) {
    b.pos[0] -= originX;
    b.pos[1] -= originY;
  }
  originX = 0;
  originY = 0;
}

let mouse = false;
let mx = 0;
let my = 0;
let isLocked = true;
let lockedBallIndex = 0;

c.addEventListener('mousedown', (e) => {
  if ((!imgui.checkBounding(e.x, e.y) && !(tutorial.checkBounding(e.x, e.y))) && e.button == 0) {
    // console.log(tutorial.checkBounding(e.x, e.y))
    mouse = true;
    mx = e.x;
    my = e.y;
    // c.style.cursor = 'grabbing'; // Change cursor to indicate panning
  } else if (e.button == 2) {
    // lock on to the ball at this location
    const mouseX = (e.clientX - c.getBoundingClientRect().left - originX) / scale;
    const mouseY = (e.clientY - c.getBoundingClientRect().top - originY) / scale;

    let lowestDist = {d:Infinity};

    for (let i = 0; i < balls.length; i++) {
      const ball = balls[i];
      const distance = Math.sqrt(
        (originX - ball.pos[0]) ** 2 + (originY - ball.pos[1]) ** 2
      );

      if (distance < lowestDist.d) {
        lowestDist.d = distance;
        lowestDist.b = i;
      }

    }

    if (lowestDist.d != Infinity) {
      isLocked = true;
      lockedBallIndex = lowestDist.b; // Lock onto this ball
    } else {
      isLocked = false;
      lockedBallIndex = -1;
    }

    
  }
})

c.addEventListener("mousemove", (e) => {

    c.style.cursor = 'grabbing'; // Change cursor to indicate panning

    // Update the origin based on mouse movement

    originX -= deltaX / scale;
    // originY += deltaY;
    originY -= deltaY / scale;

    // Update the last mouse position
    mx = e.x;
    my = e.y;

    isLocked = false;

  }
});

function screenToWorld(sx, sy) {
  const c = { x: windowWidth / 2, y: windowHeight / 2 };
  return {
    x: originX + (sx - c.x) / scale,
    y: originY + (sy - c.y) / scale
  };
}

document.addEventListener('wheel', (e) => {
  e.preventDefault();

  const rect = c.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  // Get world point under mouse before zoom
  const before = screenToWorld(mouseX, mouseY);

  // Exponential zoom for smoothness
  const ZOOM_BASE = 1.5;
  const zoomFactor = e.deltaY > 0 ? 1 / ZOOM_BASE : ZOOM_BASE;
  let newScale = finalScale * zoomFactor;

  finalScale = newScale;

  // World point under mouse after zoom
  const after = screenToWorld(mouseX, mouseY);

  // Shift camera so mouse points to same world coordinate
  originX += before.x - after.x;
  originY += before.y - after.y;
}, { passive: false });

function drawEquipotentialGradient() {

  const step = 3;

  const contourSpacing = 1e9; // adjust this (smaller = denser lines)
  const contourFrequency = 2.0; // how many waves per potential decade
  const brightness = 0.7; // overall brightness

  // create image buffer once per frame
  const imgData = ctx.createImageData(windowWidth, windowHeight);
  const data = imgData.data;

  // helper to write a pixel into the image buffer
  function writePixel(px, py, r, g, b, a = 255) {
    if (px < 0 || py < 0 || px >= windowWidth || py >= windowHeight) return;
    const i = (py * windowWidth + px) * 4;
    data[i] = r;
    data[i + 1] = g;
    data[i + 2] = b;
    data[i + 3] = a;
  }

  for (let y = 0; y <= windowHeight; y+=step) {
    for (let x = 0; x <= windowWidth; x+=step) {
      
      // convert screen coords → world coords
      const worldX = (x - originX) / scale;
      const worldY = (y - originY) / scale;

      let potential = 0
      for (var i = 0; i < balls.length; i++) {
        const ball = balls[i];
        
        const dx = worldX - ball.pos[0];
        const dy = worldY - ball.pos[1];
        potential += -g * ball.mass / Math.sqrt(dx*dx + dy*dy + 1)
      }

      // normalize and draw when potential crosses multiples of contourSpacing
      // const mod = Math.abs(potential % contourSpacing);
      // if (mod < contourSpacing * 0.02) { // 2% band thickness
      //   ctx.fillStyle = "rgba(255, 255, 100, 0.7)";
      //   ctx.fillRect(x, y, 1, 1);
      // }

      // produce a smooth shade from potential (stable-ish to pan/zoom)
      // const v = Math.log10(Math.abs(potential) + 1);
      const v = Math.log1p(Math.abs(potential)) * Math.sign(potential);
      let shade = Math.sin(v * contourFrequency) * 0.5 + 0.5;
      shade = Math.pow(shade, 1.2); // curve for nicer contrast
      const r = Math.max(0, Math.min(255, Math.floor(shade * 255 * brightness)));
      const green = Math.max(0, Math.min(255, Math.floor((shade * 255 * brightness) + 40)));
      const b = 150;

      // fill a step x step block in the image buffer (clamped to canvas)
      const maxDy = Math.min(step, windowHeight - y);
      const maxDx = Math.min(step, windowWidth - x);
      for (let dy = 0; dy < maxDy; dy++) {
        for (let dx = 0; dx < maxDx; dx++) {
          writePixel(x + dx, y + dy, r, green, b, 255);
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

function drawEquipotential() {
  const step = 3;              // pixel sampling
  const contourSpacing = 1; // distance between lines (in potential space)
  const contourSharpness = 1e-20; // thickness of each line
  const potentialScale = 1e-6;

  const w = windowWidth;
  const h = windowHeight;
  const imgData = ctx.createImageData(w, h);
  const data = imgData.data;

  // Adjust contour scaling based on zoom — this is the key
  const zoomCompensation = scale; // thinner when zoomed in

  let idx = 0;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const wx = (x - originX) / scale;
      const wy = (y - originY) / scale;

      // Sum potentials
      let potential = 0;
      for (const ball of balls) {
        const dx = wx - ball.pos[0];
        const dy = wy - ball.pos[1];
        potential += -ball.mass / Math.sqrt(dx * dx + dy * dy + 1);
      }

      // Warp potential space (log compression)
      const warped = Math.log10(Math.abs(potential) * potentialScale + 1);

      // Adjust wave frequency by zoom to keep lines visually consistent
      const wave = Math.sin(warped / (contourSpacing / zoomCompensation));
      const line = Math.exp(-Math.pow(wave / (contourSharpness / zoomCompensation), 2));

      const brightness = line * 255;
      const r = 255;
      const g = 255;
      const b = brightness * 0.5;
      const a = brightness;

      for (let sy = 0; sy < step; sy++) {
        for (let sx = 0; sx < step; sx++) {
          const px = (x + sx);
          const py = (y + sy);
          if (px >= w || py >= h) continue;
          const i = (py * w + px) * 4;
          data[i] = r;
          data[i + 1] = g;
          data[i + 2] = b;
          data[i + 3] = a;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}
